# Dedicated config for the dashboard-api service (Settings -> Config-as-code
# -> Config File Path = dashboard_api/railway.toml). Kept separate from the
# root railway.toml, which governs the mlb-agent service's own start command.
[build]
builder = "NIXPACKS"

[deploy]
startCommand = "uvicorn dashboard_api.main:app --host 0.0.0.0 --port $PORT"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
