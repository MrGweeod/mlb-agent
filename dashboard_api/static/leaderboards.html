<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diamond Line — Leaderboards</title>
<link rel="stylesheet" href="styles.css">
<style>
  body { min-height: 100vh; }
  .lb-wrap { padding: var(--space-4); max-width: 1400px; margin: 0 auto; }
  .table-scroll { overflow-x: auto; border: 1px solid var(--color-divider); }
  .lb-table th, .lb-table td { white-space: nowrap; }
  .lb-table td.name-cell { white-space: normal; font-weight: 500; }
  .lb-table th button {
    background: none; border: none; font: inherit; color: inherit; cursor: pointer;
    padding: 0; text-transform: inherit; letter-spacing: inherit;
  }
  .lb-table th.sorted button { color: var(--color-accent); }
  .as-of { font-size: 12px; opacity: 0.65; margin-bottom: var(--space-4); }
  .state-msg { padding: var(--space-6); text-align: center; opacity: 0.7; }
  .rank-cell { color: color-mix(in srgb, var(--color-text) 50%, transparent); font-size: 12px; }
</style>
</head>
<body>

<div class="nav" style="background:var(--color-surface); border-bottom:1px solid var(--color-divider);">
  <div class="nav-brand">DIAMOND LINE</div>
  <a href="/">Matchup / Batters / Pitchers</a>
  <a href="/standings.html">Standings</a>
  <a href="/leaderboards.html" aria-current="page">Leaderboards</a>
  <span class="tag tag-outline" id="asOfTag" style="margin-left:auto;"></span>
</div>

<div class="lb-wrap">
  <div class="seg" style="margin-bottom:var(--space-4);">
    <label class="seg-opt"><input type="radio" name="lbTab" value="hitting" checked><span>Hitting</span></label>
    <label class="seg-opt"><input type="radio" name="lbTab" value="pitching"><span>Pitching</span></label>
  </div>
  <div id="content"><div class="state-msg">Loading…</div></div>
</div>

<div id="authBackdrop" class="dialog-backdrop" style="z-index:100; display:none;">
  <div class="dialog">
    <div class="dialog-title">Diamond Line</div>
    <div class="dialog-body">Enter the password to load leaderboards.</div>
    <input class="input" type="password" id="authInput" placeholder="Password" autocomplete="current-password">
    <div id="authError" style="color:var(--color-accent-700); font-size:12px; display:none;"></div>
    <div class="dialog-actions">
      <button class="btn btn-primary" id="authBtn">Unlock</button>
    </div>
  </div>
</div>

<script>
(function () {
  const PW_KEY = "diamondline_pw";

  // [label, dataKey, defaultDirection]
  const HITTING_COLUMNS = [
    ["G", "games", "desc"], ["AB", "at_bats", "desc"], ["R", "runs", "desc"], ["H", "hits", "desc"],
    ["2B", "doubles", "desc"], ["3B", "triples", "desc"], ["HR", "home_runs", "desc"], ["RBI", "rbi", "desc"],
    ["BB", "walks", "desc"], ["SO", "strikeouts", "desc"], ["SB", "stolen_bases", "desc"],
    ["CS", "caught_stealing", "desc"], ["AVG", "avg", "desc"], ["OBP", "obp", "desc"],
    ["SLG", "slg", "desc"], ["OPS", "ops", "desc"],
  ];
  const PITCHING_COLUMNS = [
    ["W", "wins", "desc"], ["L", "losses", "desc"], ["ERA", "era", "asc"], ["G", "games", "desc"],
    ["GS", "games_started", "desc"], ["CG", "complete_games", "desc"], ["SHO", "shutouts", "desc"],
    ["SV", "saves", "desc"], ["SVO", "save_opportunities", "desc"], ["IP", "innings_pitched", "desc"],
    ["H", "hits_allowed", "asc"], ["R", "runs_allowed", "asc"], ["ER", "earned_runs", "asc"],
    ["HR", "home_runs_allowed", "asc"], ["HB", "hit_batters", "asc"], ["BB", "walks", "asc"],
    ["SO", "strikeouts", "desc"], ["WHIP", "whip", "asc"], ["AVG", "avg_against", "asc"],
  ];

  let state = { tab: "hitting", data: { hitting: null, pitching: null },
                sortKey: { hitting: "at_bats", pitching: "strikeouts" },
                sortDir: { hitting: "desc", pitching: "desc" } };

  function fmtNum(v, decimals) {
    if (v === null || v === undefined) return "-";
    if (decimals === 3) return v.toFixed(3).replace(/^0\./, ".").replace(/^-0\./, "-.");
    if (decimals === 2) return v.toFixed(2);
    return v;
  }

  function columnsFor(tab) { return tab === "hitting" ? HITTING_COLUMNS : PITCHING_COLUMNS; }

  function sortedPlayers(tab) {
    const players = (state.data[tab] && state.data[tab].players) || [];
    const key = state.sortKey[tab];
    const dir = state.sortDir[tab] === "asc" ? 1 : -1;
    return players.slice().sort(function (a, b) {
      const av = a[key], bv = b[key];
      if (av === null || av === undefined) return 1;
      if (bv === null || bv === undefined) return -1;
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return 0;
    });
  }

  function renderTable(tab) {
    const cols = columnsFor(tab);
    const players = sortedPlayers(tab);
    const decimalCols = tab === "hitting"
      ? { avg: 3, obp: 3, slg: 3, ops: 3 }
      : { era: 2, whip: 2, avg_against: 3 };

    const headerCells = cols.map(function (c) {
      const label = c[0], key = c[1];
      const isSorted = state.sortKey[tab] === key;
      return "<th class=\"" + (isSorted ? "sorted" : "") + "\" data-key=\"" + key + "\">" +
        "<button type=\"button\">" + label + (isSorted ? (state.sortDir[tab] === "asc" ? " ▲" : " ▼") : "") + "</button></th>";
    }).join("");

    const rows = players.map(function (p, i) {
      const cells = cols.map(function (c) {
        const key = c[1];
        const val = decimalCols[key] !== undefined ? fmtNum(p[key], decimalCols[key]) : (p[key] === null || p[key] === undefined ? "-" : p[key]);
        return "<td>" + val + "</td>";
      }).join("");
      return "<tr><td class=\"rank-cell\">" + (i + 1) + "</td><td class=\"name-cell\">" + p.name +
        "</td><td>" + (p.team || "") + "</td>" + cells + "</tr>";
    }).join("");

    return (
      "<div class=\"table-scroll\">" +
        "<table class=\"table lb-table\">" +
          "<thead><tr><th></th><th>Player</th><th>Team</th>" + headerCells + "</tr></thead>" +
          "<tbody>" + rows + "</tbody>" +
        "</table>" +
      "</div>"
    );
  }

  function render() {
    const tab = state.tab;
    if (!state.data[tab] || !state.data[tab].players || !state.data[tab].players.length) {
      document.getElementById("content").innerHTML = "<div class=\"state-msg\">No " + tab + " data yet.</div>";
      return;
    }
    document.getElementById("asOfTag").textContent = "As of " + state.data[tab].as_of_date;
    document.getElementById("content").innerHTML = renderTable(tab);

    document.querySelectorAll(".lb-table th[data-key]").forEach(function (th) {
      th.addEventListener("click", function () {
        const key = th.getAttribute("data-key");
        if (state.sortKey[tab] === key) {
          state.sortDir[tab] = state.sortDir[tab] === "asc" ? "desc" : "asc";
        } else {
          state.sortKey[tab] = key;
          const col = columnsFor(tab).find(function (c) { return c[1] === key; });
          state.sortDir[tab] = col ? col[2] : "desc";
        }
        render();
      });
    });
  }

  function showAuthDialog(onSubmit) {
    const backdrop = document.getElementById("authBackdrop");
    const input = document.getElementById("authInput");
    const err = document.getElementById("authError");
    const btn = document.getElementById("authBtn");
    backdrop.style.display = "grid";
    function submit() {
      err.style.display = "none";
      onSubmit(input.value, function (message) {
        err.textContent = message;
        err.style.display = "block";
      }, function () {
        backdrop.style.display = "none";
      });
    }
    btn.onclick = submit;
    input.onkeydown = function (e) { if (e.key === "Enter") submit(); };
    input.focus();
  }

  function fetchTab(tab, password, cb) {
    const url = "/api/leaderboards/" + tab + (password ? "?password=" + encodeURIComponent(password) : "");
    fetch(url).then(function (res) {
      if (res.status === 401) { cb("unauthorized"); return; }
      if (!res.ok) { cb("error " + res.status); return; }
      res.json().then(function (data) { cb(null, data); });
    }).catch(function () { cb("network"); });
  }

  function loadTab(tab, password) {
    document.getElementById("content").innerHTML = "<div class=\"state-msg\">Loading…</div>";
    fetchTab(tab, password, function (err, data) {
      if (err === "unauthorized") {
        showAuthDialog(function (pw, showError, close) {
          fetchTab(tab, pw, function (err2, data2) {
            if (err2 === "unauthorized") { showError("Incorrect password."); return; }
            if (err2) { showError("Error loading data."); return; }
            localStorage.setItem(PW_KEY, pw);
            close();
            state.data[tab] = data2;
            render();
          });
        });
        return;
      }
      if (err) {
        document.getElementById("content").innerHTML = "<div class=\"state-msg\">Error loading " + tab + ".</div>";
        return;
      }
      state.data[tab] = data;
      render();
    });
  }

  document.querySelectorAll('input[name="lbTab"]').forEach(function (radio) {
    radio.addEventListener("change", function () {
      state.tab = radio.value;
      if (state.data[state.tab]) { render(); } else { loadTab(state.tab, localStorage.getItem(PW_KEY) || ""); }
    });
  });

  loadTab("hitting", localStorage.getItem(PW_KEY) || "");
})();
</script>

</body>
</html>
